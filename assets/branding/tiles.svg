<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title description">
  <title id="title">Codex Limits tile preview</title>
  <desc id="description">Three Stream Deck tiles showing weekly and monthly Codex quota</desc>
  <rect width="1000" height="390" rx="24" fill="#202327"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <g transform="translate(95 50)">
      <rect width="250" height="250" rx="42" fill="#0c0f13" stroke="#3b4045" stroke-width="5"/>
      <text x="125" y="49" fill="#e2e8ed" font-size="25" font-weight="700" letter-spacing="3">PERSONAL</text>
      <text x="48" y="100" fill="#9aa7b2" font-size="24" font-weight="700">5h</text>
      <text x="199" y="100" fill="#eef2f5" font-size="31" font-weight="700">93%</text>
      <rect x="25" y="120" width="200" height="12" fill="#252c33"/>
      <rect x="25" y="120" width="186" height="12" fill="#3abe7e"/>
      <text x="48" y="179" fill="#9aa7b2" font-size="24" font-weight="700">7d</text>
      <text x="199" y="179" fill="#eef2f5" font-size="31" font-weight="700">58%</text>
      <rect x="25" y="199" width="200" height="12" fill="#252c33"/>
      <rect x="25" y="199" width="116" height="12" fill="#3abe7e"/>
    </g>

    <g transform="translate(375 50)">
      <rect width="250" height="250" rx="42" fill="#0c0f13" stroke="#3b4045" stroke-width="5"/>
      <text x="125" y="49" fill="#e2e8ed" font-size="25" font-weight="700" letter-spacing="3">TEAM</text>
      <text x="125" y="111" fill="#9aa7b2" font-size="29" font-weight="700">~30d</text>
      <text x="125" y="174" fill="#eef2f5" font-size="54" font-weight="700">83%</text>
      <rect x="25" y="202" width="200" height="12" fill="#252c33"/>
      <rect x="25" y="202" width="166" height="12" fill="#3abe7e"/>
    </g>

    <g transform="translate(655 50)">
      <rect width="250" height="250" rx="42" fill="#0c0f13" stroke="#3b4045" stroke-width="5"/>
      <text x="125" y="49" fill="#e2e8ed" font-size="25" font-weight="700" letter-spacing="3">WORK</text>
      <text x="48" y="100" fill="#9aa7b2" font-size="24" font-weight="700">5h</text>
      <text x="199" y="100" fill="#eef2f5" font-size="31" font-weight="700">44%</text>
      <rect x="25" y="120" width="200" height="12" fill="#252c33"/>
      <rect x="25" y="120" width="88" height="12" fill="#eea43a"/>
      <text x="48" y="179" fill="#9aa7b2" font-size="24" font-weight="700">7d</text>
      <text x="199" y="179" fill="#eef2f5" font-size="31" font-weight="700">17%</text>
      <rect x="25" y="199" width="200" height="12" fill="#252c33"/>
      <rect x="25" y="199" width="34" height="12" fill="#e84848"/>
    </g>
  </g>

  <text x="500" y="350" fill="#8d99a4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" text-anchor="middle">
    One key per account · shared cache · press to refresh
  </text>
</svg>
